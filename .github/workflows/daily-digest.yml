name: Daily farm digest

# Soon after the last game ends, which is what bounds how early this can run.
# The latest first pitch at any full-season level is 02:05 UTC, so even a long
# extra-inning game is over by about 06:05. Seven past seven leaves an hour on
# top of that, and the digest reports on yesterday by default.
#
# It runs at 07:07 UTC because it is read in the morning in Britain — but the
# schedule is no longer here. The workflow-trigger Worker dispatches it.
#
# GitHub queues scheduled events best-effort, and the wait grew from a median
# of 66 minutes to one of 6.7 hours in late August, with a worst case of 9.6
# hours. No cron expression survives that: the game data is not complete before
# about 06:05, so there is no slot that both waits for it and still arrives
# before breakfast. A dispatched run skips the queue and starts within seconds.
#
# To change when this runs, edit wrangler.jsonc and JOBS in workflow-trigger.
# There is nothing left in this file that controls the timing.
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Day to report on (YYYY-MM-DD, default yesterday)"
        type: string
      dry_run:
        description: "Print the digest instead of emailing it"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare config home
        run: echo "MLB_REPORT_CONFIG_HOME=${RUNNER_TEMP}/mlb-report" >> "$GITHUB_ENV"

      # The game log store is the season's accumulated history, and trends are
      # computed from it. Losing it would not break a run, but it would flatten
      # every streak until the store refilled.
      - name: Restore history from the last run
        # Pinned to a commit, not a tag: a tag can be moved, and this action
        # runs in the job that holds the SMTP credentials.
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          name: mlb-report-history
          path: ${{ runner.temp }}/mlb-report/data
          workflow: daily-digest.yml
          if_no_artifact_found: ignore

      - name: Write per-user config
        env:
          MLB_REPORT_USER_JSON: ${{ secrets.MLB_REPORT_USER_JSON }}
          MLB_REPORT_USER_ENV: ${{ secrets.MLB_REPORT_USER_ENV }}
        run: |
          mkdir -p "$MLB_REPORT_CONFIG_HOME/data"
          if [ -z "$MLB_REPORT_USER_JSON" ] || [ -z "$MLB_REPORT_USER_ENV" ]; then
            echo "::error::Missing secrets. See docs/GITHUB_SECRETS.md"
            exit 1
          fi
          printf '%s' "$MLB_REPORT_USER_JSON" > "$MLB_REPORT_CONFIG_HOME/user.json"
          python3 -m json.tool "$MLB_REPORT_CONFIG_HOME/user.json" > /dev/null
          printf '%s' "$MLB_REPORT_USER_ENV" > "$MLB_REPORT_CONFIG_HOME/.env"
          chmod 600 "$MLB_REPORT_CONFIG_HOME/user.json" "$MLB_REPORT_CONFIG_HOME/.env"

      # The digest reports only the skills it has play-by-play for, so without
      # this the batted-ball bars go missing rather than going wrong. Cached
      # games are skipped: a full backfill on the first run, a day's games
      # after that.
      - name: Gather play-by-play
        run: ./scripts/gather-pitch-data

      # Inputs arrive through the environment rather than being pasted into the
      # script, so a value chosen by whoever dispatched the run is data to the
      # shell rather than more of the command.
      - name: Send digest
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$REPORT_DATE" ]; then
            ARGS="--date $REPORT_DATE"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          ./scripts/run $ARGS

      # Uploaded even when the send fails: the day's fetched logs and swing
      # outcomes are still worth keeping, and rebuilding them costs a full
      # crawl. The play-by-play cache is the expensive half, at one request
      # per game across a whole season.
      - name: Persist history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-report-history
          path: |
            ${{ runner.temp }}/mlb-report/data/game_logs_*.ndjson
            ${{ runner.temp }}/mlb-report/data/pitch_*.json
          retention-days: 400
          if-no-files-found: warn
